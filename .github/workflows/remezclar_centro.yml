name: Centro · remezclar vídeos con la voz nueva

# Orden del dueño 12/11/2026: voz con compresor, presencia y sin eco. Remezcla los vídeos del Centro con equipo/voz.json → cadena_voz,
# los sube a la release «centro-v3» y los añade a las colas de atrasos de Facebook (reels ≤ 90 s) y YouTube (todos).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remezclar-centro
  cancel-in-progress: false

jobs:
  remezclar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Remezclar y encolar
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 herramientas/remezclar_centro.py
      - name: Guardar colas
        run: |
          git config user.name "expedientes-bot"
          git config user.email "expedientes-bot@users.noreply.github.com"
          git add atrasos
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -q -m "Centro: vídeos remezclados con la voz nueva en las colas de atrasos"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep 7; done
          exit 1
