name: TikTok · programar en Buffer

# Dos veces al día rellena la cola de TikTok (@neogestlab) en Buffer con reels ya aprobados y publicados en Instagram.
# Sin el secreto BUFFER_API_KEY no hace nada (TikTok en espera). Manual: equipo/tiktok/LEEME.md
on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"
    - cron: "23 15 * * *"

permissions:
  contents: write

concurrency:
  group: tiktok
  cancel-in-progress: false

jobs:
  tiktok:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Programar
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 herramientas/tiktok_buffer.py
      - name: Guardar estado
        run: |
          git config user.name "equipo-tiktok"
          git config user.email "actions@users.noreply.github.com"
          git add equipo/tiktok/estado.json
          git diff --cached --quiet && exit 0
          git commit -m "TikTok: cola programada en Buffer"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
