name: Demos de apps (carruseles, historias y reels)

# Descarga las capturas REALES de demo del Centro de Contenido Apps (*.base44.app solo es accesible desde aquí)
# y genera en cola/ el carrusel, las historias y el reel de presentación de cada app (herramientas/demo_app.py,
# textos en herramientas/demo_apps.json). Las capturas quedan en herramientas/demos/, fuera de git (.gitignore),
# para no pasar de los 50 MB por repo que sirve jsDelivr (las imágenes de carruseles e historias van por jsDelivr). Los reels se suben a la release «cola». No publica nada: lo hace el
# ciclo cuando la pieza tiene su calidad.json aprobado. Creado por el agente de demos el 8/11/2026.
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Slugs separados por espacios o comas (vacío o «todas» = todas; «ninguna» = solo reels de carrusel)"
        type: string
        default: "todas"
      solo_descargar:
        description: "Solo descargar las capturas (sin generar piezas)"
        type: boolean
        default: false
      reel:
        description: "Generar también el reel de presentación"
        type: boolean
        default: true
      historias:
        description: "Generar las historias (vídeo con música)"
        type: boolean
        default: true
      solo:
        description: "Solo estas piezas (carpetas de cola/ separadas por comas, p. ej. 203_studio_beats_pro_reel). Vacío = todas las de los slugs"
        type: string
        default: ""
      carruseles:
        description: "Versión reel con música de carruseles ya aprobados (carpetas de cola/, «todos» o «ninguno»)"
        type: string
        default: "ninguno"

permissions:
  contents: write

concurrency:
  group: demo-app
  cancel-in-progress: false

jobs:
  demos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # reels de carruseles ya publicados: sus diapositivas salen del historial
      - name: Herramientas
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20"
          if ! command -v ffmpeg >/dev/null; then
            for i in 1 2 3; do
              sudo timeout 180 apt-get $APT update -qq && sudo timeout 180 apt-get $APT install -y -qq ffmpeg > /dev/null && break
              sleep 10
            done
          fi
          pip install --quiet pillow numpy
      - name: Descargar capturas de demo
        run: |
          S="${{ inputs.slugs }}"; [ -z "$S" ] && S=todas
          python3 herramientas/demo_app.py descargar $S
      - name: Generar piezas
        if: ${{ !inputs.solo_descargar }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          S="${{ inputs.slugs }}"; [ -z "$S" ] && S=todas
          OPC="--subir"
          [ "${{ inputs.reel }}" = "true" ] || OPC="$OPC --sin-reel"
          [ "${{ inputs.historias }}" = "true" ] || OPC="$OPC --sin-historias"
          [ -n "${{ inputs.solo }}" ] && OPC="$OPC --solo=${{ inputs.solo }}"
          if [ "$S" != "ninguna" ]; then python3 herramientas/demo_app.py generar $S $OPC; fi
          C="${{ inputs.carruseles }}"
          if [ -n "$C" ] && [ "$C" != "ninguno" ]; then python3 herramientas/demo_app.py reels_carrusel $C --subir; fi
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add cola
          git commit -q -m "Demos de apps: capturas y piezas $(date -u +%FT%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
