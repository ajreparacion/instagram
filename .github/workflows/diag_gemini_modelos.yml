name: Diagnóstico temporal · modelos Gemini disponibles

# Workflow de usar y tirar (17/11/2026): los 3 modelos de MODELOS en guionista_gemini.py
# fallaron en los primeros runs reales (503 saturado o 404 "ya no disponible para cuentas
# nuevas"). Este workflow solo lista qué modelos acepta la clave GEMINI_API_KEY ahora mismo,
# para corregir la lista. Se borra en cuanto se tenga la respuesta.

on:
  workflow_dispatch:

jobs:
  listar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 herramientas/gemini_modelos.py
