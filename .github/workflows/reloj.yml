name: Reloj (lanza el ciclo cada 15 min)

# El horario (cron) de GitHub se retrasa o se salta ejecuciones (8/11/2026: ninguna en casi 3 h).
# Este reloj vive dentro de Actions, sin ningún ordenador encendido: durante ~5 h 45 min lanza
# «Ciclo Instagram» cada 15 minutos (si no hay uno en marcha o en espera) y al final se relanza a sí mismo.
# Repo público: los minutos de Actions son gratis.

on:
  workflow_dispatch:
  schedule:
    - cron: "5 */6 * * *"   # respaldo por si la cadena se rompe

permissions:
  actions: write
  contents: read

concurrency:
  group: reloj-instagram
  cancel-in-progress: false

jobs:
  reloj:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Lanzar el ciclo cada 15 minutos
        run: |
          fin=$(( $(date +%s) + 345*60 ))
          vuelta=0
          while [ "$(date +%s)" -lt "$fin" ]; do
            activos=$(gh run list -R "$REPO" -w ciclo.yml -L 5 --json status \
              --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="pending" or .status=="waiting")] | length' || echo 0)
            if [ "${activos:-0}" = "0" ]; then
              echo "$(TZ=Europe/Madrid date '+%F %H:%M') lanzo el ciclo"
              gh workflow run ciclo.yml -R "$REPO" --ref main || echo "no se pudo lanzar"
            else
              echo "$(TZ=Europe/Madrid date '+%F %H:%M') ya hay un ciclo en marcha o en espera"
            fi
            # Contestador del chat de Instagram (gratis): misma cadencia que el ciclo
            gh workflow run respuestas_chat.yml -R "$REPO" --ref main || echo "no se pudo lanzar el contestador"
            # Comunidad (comentarios de Facebook y YouTube): cada hora (una de cada 4 vueltas)
            if [ $(( vuelta % 4 )) = 0 ]; then
              gh workflow run comunidad.yml -R "$REPO" --ref main || echo "no se pudo lanzar comunidad"
            fi
            # Calidad (API): cada hora, a mitad de hora respecto a comunidad (21/11/2026, orden del dueño «sin cuellos de
            # botella»): el cron de calidad_api.yml llegaba con horas de retraso y las piezas renderizadas esperaban nota.
            # Si no hay nada que evaluar, la pasada sale en segundos sin llamar a la API ni escribir en el tablón.
            if [ $(( vuelta % 4 )) = 2 ]; then
              activa=$(gh run list -R "$REPO" -w calidad_api.yml -L 3 --json status \
                --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="pending")] | length' || echo 0)
              if [ "${activa:-0}" = "0" ]; then
                gh workflow run calidad_api.yml -R "$REPO" --ref main -f origen=reloj || echo "no se pudo lanzar calidad"
              fi
            fi
            vuelta=$(( vuelta + 1 ))
            sleep 900
          done
      - name: Relanzar el reloj
        if: always()
        run: gh workflow run reloj.yml -R "$REPO" --ref main
