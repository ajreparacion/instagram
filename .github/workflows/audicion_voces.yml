name: Audición de voces (muestras para que el dueño elija de oído)

# Solo a mano. Genera las mismas frases con varias voces (Edge es-ES, Chatterbox con voz integrada) y sube los mp3 a la
# release «pruebas». No publica nada en Instagram ni toca la cola. Creado el 12/11/2026 por la queja «suena a lata».
on:
  workflow_dispatch:
    inputs:
      variantes:
        description: "Variantes separadas por comas (vacío = todas): edge_alvaro,edge_elvira,edge_ximena,edge_alvaro_energico,cb_es,cb_mtl"
        default: ""

permissions:
  contents: write

concurrency:
  group: audicion-voces
  cancel-in-progress: true

jobs:
  audicion:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install --quiet edge-tts numpy
      - name: Caché de modelos
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.cache/pip
          key: audicion-voces-v1
          restore-keys: |
            prueba-voz-v2-
            voz-v2-
      - name: Chatterbox (CPU, entorno propio)
        if: ${{ inputs.variantes == '' || contains(inputs.variantes, 'cb_') }}
        continue-on-error: true
        run: |
          python -m venv ~/.venvs/chatterbox
          ~/.venvs/chatterbox/bin/pip install --quiet --upgrade pip
          ~/.venvs/chatterbox/bin/pip install --quiet chatterbox-tts --extra-index-url https://download.pytorch.org/whl/cpu
          ~/.venvs/chatterbox/bin/python -c "import chatterbox.mtl_tts, torch; print('chatterbox OK, torch', torch.__version__)"
          echo "PYTHON_CHATTERBOX=$HOME/.venvs/chatterbox/bin/python" >> "$GITHUB_ENV"
      - name: Audición
        run: python3 herramientas/audicion_voces.py "${{ inputs.variantes }}"
      - name: Subir mp3 a la release "pruebas"
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls /tmp/audicion/salida/*.mp3 || exit 0
          gh release view pruebas >/dev/null 2>&1 || gh release create pruebas --title "Pruebas de producción" --notes "Pruebas (no se publican)."
          gh release upload pruebas /tmp/audicion/salida/*.mp3 --clobber
