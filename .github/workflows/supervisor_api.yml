name: Supervisor · API directa (piloto créditos API, 16/11/2026)

# Sustituye, SOLO para el rol Supervisor, la tarea programada de Claude Code por una llamada
# directa a la API de Anthropic (herramientas/supervisor_api.py), pagada con los créditos de
# la API y no con el límite semanal del plan Max. Mismo horario que equipo/roles/supervisor.md
# (12:27 y 18:27 hora de Madrid); el cron de GitHub es en UTC y no sigue el cambio de hora
# oficial, así que se fija en hora de invierno (UTC+1) como el resto de workflows del repo.
# Ver equipo/tablon.md (16/11/2026) y claude/areas/creditos-api-anthropic.md (doc del proyecto).

on:
  workflow_dispatch:
  schedule:
    - cron: "27 11 * * *"  # 12:27 Madrid (UTC+1)
    - cron: "27 17 * * *"  # 18:27 Madrid (UTC+1)

permissions:
  contents: write

concurrency:
  group: supervisor-api
  cancel-in-progress: false

jobs:
  supervisor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --quiet anthropic

      - name: Supervisor (Haiku vía API)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 herramientas/supervisor_api.py

      - name: Guardar y subir
        run: |
          git config user.name "expedientes-bot"
          git config user.email "expedientes-bot@users.noreply.github.com"
          git add equipo/tablon.md
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear"
            exit 0
          fi
          git commit -m "Supervisor (API): pasada automática"
          for i in 1 2 3; do
            git push origin main && break
            git pull --rebase origin main
          done
