<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba de la plantilla (fixture de test, NO publicar)</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Poppins,system-ui,sans-serif;background:#fff;color:#1c1a18}
header{padding:18px 16px 10px;border-bottom:1px solid #eee;font-weight:700;font-size:18px}
main{padding:16px}label{font-size:13px;color:#666}
textarea{width:100%;height:120px;margin:6px 0 10px;padding:10px;font:inherit;font-size:15px;border:1px solid #ccd;border-radius:10px;resize:none}
button{background:#00b8d9;color:#fff;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:700;font-size:15px}
ul{list-style:none;padding:0;margin:16px 0}li{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid #eee;border-radius:10px;margin-bottom:8px;font-size:15px;transition:.3s}
li.ok{background:#e6f9ee;text-decoration:line-through;color:#6a8}
.box{width:20px;height:20px;border:2px solid #00b8d9;border-radius:6px;flex:none}li.ok .box{background:#00b8d9}
#fin{display:none;margin-top:10px;padding:12px;border-radius:10px;background:#f1fbfd;font-size:14px}
</style></head><body>
<header>Lista del día</header>
<main>
<label for="p">Escribe tus tareas (una por línea)</label>
<textarea id="p"></textarea>
<button id="go">Ordenar</button>
<ul id="lista"></ul>
<div id="fin">Todo hecho. Buen trabajo.</div>
</main>
<script>
document.getElementById('go').onclick=()=>{
 const l=document.getElementById('lista');l.innerHTML='';
 document.getElementById('p').value.split('\n').map(s=>s.trim()).filter(Boolean).forEach(t=>{
  const li=document.createElement('li');li.innerHTML='<span class="box"></span><span></span>';li.lastChild.textContent=t;
  li.onclick=()=>{li.classList.toggle('ok');document.getElementById('fin').style.display=document.querySelectorAll('li:not(.ok)').length?'none':'block'};
  l.appendChild(li)})}
</script></body></html>
