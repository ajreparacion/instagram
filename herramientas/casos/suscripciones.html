<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mis suscripciones</title>
<style>
:root{--bg:#E6F1F4;--card:#fff;--ink:#14212B;--mut:#5B6B77;--acc:#00B8D9;--accd:#008FAB;--line:#DCE6EB}
*{box-sizing:border-box;margin:0;font-family:Poppins,Inter,Arial,sans-serif}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:var(--ink)}
.view{position:absolute;left:70px;top:750px;width:940px;opacity:0;transform:translateY(calc(-50% + 24px));transition:opacity .35s,transform .35s;pointer-events:none}
.view.on{opacity:1;transform:translateY(-50%);pointer-events:auto}
.card{background:var(--card);border-radius:44px;padding:48px;box-shadow:0 18px 50px rgba(20,33,43,.10)}
.chip{display:inline-block;background:var(--acc);color:#fff;font-weight:700;font-size:30px;padding:8px 26px;border-radius:40px;margin-bottom:26px}
h2{font-size:54px;font-weight:700;margin-bottom:26px}
label{display:block;font-size:30px;color:var(--mut);font-weight:500;margin-bottom:8px}
input,textarea,select{width:100%;font-size:42px;padding:16px 22px;border:3px solid var(--line);border-radius:22px;color:var(--ink);background:#fff;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
button{font-size:40px;font-weight:600;border:0;border-radius:26px;padding:20px 38px;background:var(--acc);color:#fff}
button.sec{background:#EAF0F3;color:var(--ink)}
.big{font-size:96px;font-weight:700;color:var(--accd);line-height:1.05}
.row{display:flex;gap:18px;align-items:center}
#cur{position:fixed;left:0;top:0;width:60px;height:60px;z-index:99;pointer-events:none;opacity:0;transition:opacity .2s}
#cur svg{filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
.rip{position:fixed;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:5px solid var(--acc);z-index:98;pointer-events:none;animation:rip .5s ease-out forwards}
@keyframes rip{to{transform:scale(3);opacity:0}}
.caret::after{content:"";display:inline-block;width:5px;height:1em;background:var(--acc);margin-left:3px;vertical-align:-6px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}

.f{display:grid;grid-template-columns:1fr 200px;gap:14px;margin-bottom:14px}
.f input{font-size:38px}
.it{display:flex;align-items:center;gap:20px;background:#F3F7F9;border-radius:24px;padding:20px 26px;margin-bottom:14px;font-size:40px;transition:opacity .3s}
.it .n{flex:1;font-weight:500}
.it.off{opacity:.38}.it.off .n,.it.off .p{text-decoration:line-through}
.ck{width:62px;height:62px;border-radius:18px;border:4px solid var(--acc);background:var(--acc);color:#fff;font-size:42px;line-height:54px;text-align:center;font-weight:700}
.off .ck{background:#fff;color:#fff}
.sum{display:flex;gap:18px;margin-top:20px}
.sum div{flex:1;background:#EAF7FA;border-radius:30px;padding:26px;text-align:center}
.sum span{display:block;font-size:30px;color:var(--mut)}
.sum b{font-size:60px;color:var(--accd)}
#ah{margin-top:18px;text-align:center;font-size:38px;font-weight:600;min-height:56px}

</style></head><body>
<div id="vp" class="view"><div class="card"><span class="chip">Mi mensaje a la IA</span>
<div id="ptxt" class="caret" style="font-size:46px;line-height:1.38;font-weight:500;min-height:420px"></div>
<div class="row" style="justify-content:flex-end;margin-top:10px"><button id="send">Enviar &rarr;</button></div></div></div>
<div id="vt" class="view"><div class="card">
<h2>Mis suscripciones</h2>
<div class="f"><input id="nom" placeholder="Nombre"><input id="pre" inputmode="decimal" placeholder="€/mes"></div>
<button id="add" style="width:100%;margin-bottom:22px">Añadir</button>
<div id="lista" style="min-height:290px"></div>
<div class="sum"><div><span>Al mes</span><b id="mes">0,00 €</b></div><div><span>Al año</span><b id="anio">0,00 €</b></div></div>
<div id="ah"></div></div></div>
<div id="cur"><svg width="60" height="60" viewBox="0 0 24 24"><path d="M3 2l7.5 19 2.7-7.8L21 10.5z" fill="#fff" stroke="#14212B" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
<script>
const $=s=>document.querySelector(s);
const eur=c=>(c/100).toFixed(2).replace('.',',')+' €';
document.addEventListener('mousemove',e=>{const c=$('#cur');c.style.opacity=1;c.style.transform='translate('+(e.clientX-6)+'px,'+(e.clientY-4)+'px)'});
document.addEventListener('mousedown',e=>{const r=document.createElement('div');r.className='rip';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),600)});
window.showPrompt=()=>{$('#vt').classList.remove('on');$('#vp').classList.add('on')};
window.showTool=()=>{$('#vp').classList.remove('on');$('#vt').classList.add('on')};
window.setPrompt=t=>{$('#ptxt').textContent=t};

const num=v=>{v=String(v||'').replace(',','.').replace(/[^0-9.]/g,'');return parseFloat(v)||0};
let S=[];
function draw(){const L=$('#lista');L.innerHTML='';S.forEach((s,i)=>{const d=document.createElement('div');d.className='it'+(s.on?'':' off');d.innerHTML='<span class="ck">'+(s.on?'✓':'')+'</span><span class="n"></span><b class="p">'+eur(s.c)+'</b>';d.querySelector('.n').textContent=s.n;d.querySelector('.ck').addEventListener('click',()=>{s.on=!s.on;draw()});L.appendChild(d)});
const m=S.filter(s=>s.on).reduce((a,s)=>a+s.c,0),all=S.reduce((a,s)=>a+s.c,0);$('#mes').textContent=eur(m);$('#anio').textContent=eur(m*12);
const ah=(all-m)*12;$('#ah').textContent=ah>0?'Ahorras '+eur(ah)+' al año':''}
$('#add').addEventListener('click',()=>{const c=Math.round(num($('#pre').value)*100);if(!$('#nom').value.trim()||!c)return;S.push({n:$('#nom').value.trim(),c:c,on:true});$('#nom').value='';$('#pre').value='';draw()});
window.reset=()=>{S=[];$('#nom').value='';$('#pre').value='';draw()};
window.preset=()=>{S=[{n:'Streaming',c:1299,on:true},{n:'Música',c:1099,on:true},{n:'Gimnasio',c:2990,on:true}];draw()};
window.reset();

</script></body></html>
